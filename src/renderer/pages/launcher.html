<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://piston-meta.mojang.com" />
  <title>Mine-Launcher</title>
  <link rel="stylesheet" href="../styles/launcher.css" />
</head>

<body>
  <div class="launcher-container">
    <div class="logo-header">
      <img src="../../assets/images/logo.png" alt="Logo" class="launcher-logo" />
      <div class="welcome-box">
        <p id="welcome" class="welcome-text">Bienvenido ...</p>
      </div>
    </div>

    <button id="playBtn" class="play-btn">
      PLAY
    </button>

    <div id="progressContainer" class="progress-container">
      <div class="progress-bar-wrapper">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <p id="progressText" class="progress-text"></p>
    </div>

    <div class="version-selector">
      <select id="versionSelect" class="version-select">
        <option value="" disabled selected>Cargando versiones...</option>
      </select>
      <div class="dropdown-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </div>
    </div>
  </div>

  <script src="../js/launcher.js"></script>
</body>

</html>
